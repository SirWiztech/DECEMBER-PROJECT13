<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body class="bodycalc">
    <h2 class="tools tools1" id="tools">WIZ - CALCULATOR</h2>
    <div class="calculator">

        <div class="screen">

        </div>

        <div class="buttons">
            <div class="keys">#</div>
            <div class="keys">~</div>
            <div class="keys">sin</div>
            <div class="keys">deg</div>
            <div class="keys">Ac</div>
            <div class="keys">x</div>
            <div class="keys money">/</div>
            <div class="keys money">*</div>
            <div class="keys">7</div>
            <div class="keys">8</div>
            <div class="keys">9</div>
            <div class="keys money">-</div>
            <div class="keys">4</div>
            <div class="keys">5</div>
            <div class="keys">6</div>
            <div class="keys plus money">+</div>
            <div class="keys">1</div>
            <div class="keys">2</div>
            <div class="keys">3</div>
            <div class="keys equals" id="zero">0</div>
            <div class="keys">.</div>
            <div class="keys equal2 money">=</div>
            
        </div>
        
    </div>
</body>
</html>
